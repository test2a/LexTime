<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LexTime — Offline Legal Practice & Client Money</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:#1e293b;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.flex{display:flex}.wrap{flex-wrap:wrap}.col{flex-direction:column}.center{align-items:center}.between{justify-content:space-between}.grow{flex:1}.gap1{gap:4px}.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}
.mb2{margin-bottom:8px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}.mt4{margin-top:16px}.mt6{margin-top:24px}
#splash{position:fixed;inset:0;z-index:200;background:#020617;display:flex;align-items:center;justify-content:center;text-align:center}
#splash .logo{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:rgba(251,191,36,.1);display:flex;align-items:center;justify-content:center}
#splash h1{color:#fff;font-size:20px}
#splash p{color:#94a3b8;font-size:14px;margin-top:8px}
#lockScreen{position:fixed;inset:0;z-index:50;background:#020617;display:flex;align-items:center;justify-content:center;padding:16px}
.lockbox{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 25px 50px rgba(0,0,0,.4);padding:32px}
#pinDots{display:flex;justify-content:center;gap:12px;margin:28px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1}
#keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#keypad button{height:56px;border-radius:12px;background:#f1f5f9;border:0;font-weight:700;font-size:18px}
#keypad button:hover{background:#e2e8f0}
#lockMessage{text-align:center;font-size:12px;color:#dc2626;height:16px;margin-top:16px}
.app{display:flex;min-height:100vh}
.sidebar{width:64px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;flex-shrink:0}
@media(min-width:1024px){.sidebar{width:288px}}
.sidebar .brand{display:flex;align-items:center;gap:12px;padding:0 16px;height:64px;border-bottom:1px solid #1e293b}
.sidebar .brand .logo{width:36px;height:36px;border-radius:12px;background:rgba(251,191,36,.1);display:flex;align-items:center;justify-content:center}
.sidebar .brand .title{display:none}
@media(min-width:1024px){.sidebar .brand .title{display:block}.sidebar .brand .title b{color:#fff;font-size:14px;display:block}.sidebar .brand .title span{font-size:11px;color:#64748b}}
.nav{flex:1;overflow-y:auto;padding:16px 8px;display:flex;flex-direction:column;gap:4px}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:8px;background:transparent;border:0;text-align:left;font-size:14px;color:#cbd5e1}
.nav button:hover{background:rgba(30,41,59,.6);color:#fff}
.nav button.active{background:#1e293b;color:#fff;font-weight:600;border-left:2px solid #fbbf24}
.nav .ilabel{display:none}
@media(min-width:1024px){.nav .ilabel{display:inline}}
.sidebar .foot{padding:12px;border-top:1px solid #1e293b}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}
.topbar h2{font-size:18px;font-weight:700}
.topbar .sub{font-size:12px;color:#94a3b8;display:none}
@media(min-width:768px){.topbar .sub{display:block}}
.chip-timer{display:flex;align-items:center;gap:8px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.dotred{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.main{flex:1;overflow-y:auto;padding:32px}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.pagehead h1{font-size:20px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;border:1px solid transparent;transition:background .15s}
.btn-dark{background:#0f172a;color:#fff}.btn-dark:hover{background:#1e293b}
.btn-light{background:#fff;border-color:#cbd5e1;color:#334155}.btn-light:hover{border-color:#94a3b8}
.btn-green{background:#059669;color:#fff}.btn-green:hover{background:#10b981}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cardhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f1f5f9;font-weight:700}
.cardbody{padding:20px}
.grid{display:grid;gap:16px}
.g1{grid-template-columns:repeat(1,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1024px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g4,.g3{grid-template-columns:1fr}}
.stat{padding:20px}
.stat .lbl{font-size:12px;font-weight:500;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
.stat .val{font-size:24px;font-weight:800;margin-top:8px}
.stat .subv{font-size:12px;color:#94a3b8;margin-top:4px}
.stat .ico{width:40px;height:40px;border-radius:12px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.input,.select,.textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px 14px;font-size:14px;background:#fff;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:#94a3b8;box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.textarea{resize:none;min-height:80px}
table.tbl{width:100%;font-size:14px;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#94a3b8;font-weight:600;padding:12px 16px;border-bottom:1px solid #f1f5f9}
.tbl td{padding:12px 16px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.tbl tr:hover td{background:#f8fafc}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:600}
.chip-green{background:#d1fae5;color:#047857}.chip-blue{background:#dbeafe;color:#1d4ed8}.chip-amber{background:#fef3c7;color:#b45309}.chip-gray{background:#f1f5f9;color:#475569}.chip-red{background:#fee2e2;color:#b91c1c}
.rowline{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #f1f5f9}
.rowline:last-child{border-bottom:0}
.mono{font-variant-numeric:tabular-nums}
.avatar{width:44px;height:44px;border-radius:12px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.empty{padding:56px 0;text-align:center;color:#94a3b8}
.empty .eico{width:48px;height:48px;border-radius:16px;background:#f1f5f9;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.modal-ov{position:fixed;inset:0;z-index:90;background:rgba(2,6,23,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;box-shadow:0 25px 50px rgba(0,0,0,.3);width:100%;max-width:560px;margin:32px 0}
.modal.wide{max-width:900px}
.modalhead{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #f1f5f9}
.modalhead h3{font-size:18px;font-weight:700}
.modalhead .msub{font-size:14px;color:#94a3b8;margin-top:2px}
.modalbody{padding:24px}
.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid #f1f5f9}
.iconbtn{background:transparent;border:0;border-radius:8px;padding:6px;color:#94a3b8}
.iconbtn:hover{background:#f1f5f9;color:#334155}
#toasts{position:fixed;top:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px;width:320px;max-width:calc(100vw - 32px)}
.toast{padding:12px 16px;border-radius:12px;color:#fff;font-size:14px;box-shadow:0 10px 25px rgba(0,0,0,.2);display:flex;gap:8px;align-items:flex-start}
.toast.ok{background:#059669}.toast.err{background:#dc2626}.toast.warn{background:#d97706}.toast.info{background:#1e293b}
.bar{height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:#0f172a;border-radius:999px}
.bar.red>div{background:#ef4444}.bar.em>div{background:#10b981}
details.summaryrow>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0}
details.summaryrow>summary::-webkit-details-marker{display:none}
pre.dump{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border-radius:8px;padding:8px;font-size:12px;color:#475569}
.invoice{padding:32px 48px}
.invoice h2{font-size:20px;font-weight:800}
.invoice .muted{color:#64748b;font-size:14px}
.invoice .small{font-size:12px;color:#94a3b8}
@media print{.sidebar,.topbar,.pagehead,.modal-ov,#toasts,#splash{display:none!important}.main{padding:0}.card{border:0;box-shadow:none}.no-print{display:none!important}}
</style>
</head>

function cyrb53(str, seed){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507); h1 ^= Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507); h2 ^= Math.imul(h1 ^ (h1>>>13), 3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}

const WS = { handle:null, rev:0, name:'', mode:'none', saving:false };

async function writeWorkspaceFile(){
  if(!WS.handle) return;
  WS.rev = (WS.rev||0) + 1;
  const payload = { type:'lex-workspace', version:2, rev:WS.rev, savedAt:nowISO(), db:clone(db) };
  const text = JSON.stringify(payload, null, 2);
  try{
    const w = await WS.handle.createWritable();
    await w.write(text); await w.close();
    meta.lastBackupAt = nowISO(); saveMeta();
  }catch(e){ toast('Workspace write failed: '+(e.message||e),'error'); }
}
async function pushWorkspace(){
  if(WS.mode!=='file' || !WS.handle) return;
  let remote=null;
  try{
    const file = await WS.handle.getFile();
    const json = JSON.parse(await file.text());
    remote = { rev: json.rev||0, db: normalizeParsed(json.db||{}) };
  }catch(e){ /* file may not exist yet or unreadable — treat as remote */ }
  if(remote && remote.rev > (WS.rev||0)){
    const decision = await workspaceConflictPrompt(remote);
    if(decision==='cancel') return;
    if(decision==='remote'){ db = remote.db; WS.rev = remote.rev; meta=defaultMeta(); meta.integrity=computeDigest(); persistAll(); toast('Loaded the newer file version.'); renderApp(); return; }
    if(decision==='local'){ await writeWorkspaceFile(); toast('Your version was written to the file.'); return; }
    if(decision==='merge'){
      const result = mergeDatabases(db, remote.db);
      db = result.db;
      WS.rev = remote.rev;
      meta=defaultMeta(); meta.integrity=computeDigest(); persistAll();
      await writeWorkspaceFile();
      toast('Merged ' + (result.changed||0) + ' records. File updated.');
      renderApp(); return;
    }
    return;
  }
  await writeWorkspaceFile();
}
function mergeDatabases(local, remote){
  const out = clone(local);
  const changed = [];
  const byId = (arr) => { const m = new Map(); (arr||[]).forEach(x=>{ if(x&&x.id) m.set(x.id,x); }); return m; };
  const mergeList = (key) => {
    const L = byId(local[key]); const R = byId(remote[key]);
    const map = new Map();
    L.forEach((v,id)=> map.set(id,{id, local:v, remote:R.has(id)?R.get(id):null}));
    R.forEach((v,id)=>{ if(!map.has(id)) map.set(id,{id, local:null, remote:v}); });
    const arr = [];
    map.forEach(({id, local, remote})=>{
      if(local && remote && JSON.stringify(local)!==JSON.stringify(remote)){
        changed.push({entity:key, id, local, remote});
        arr.push(local); /* local wins by default; user may choose remote via prompt */
      } else {
        arr.push(remote ? remote : local);
      }
    });
    out[key] = arr;
  };
  ['clients','matters','timeEntries','expenses','invoices','auditLog','ledgerEntries','journalMeta'].forEach(mergeList);
  out.settings = Object.assign(clone(local.settings), clone(remote.settings));
  out.seq = { invoice: Math.max(local.seq.invoice, remote.seq.invoice), receipt: Math.max(local.seq.receipt, remote.seq.receipt), journal: Math.max(local.seq.journal||1, remote.seq.journal||1) };
  return { db: out, conflicts: changed, changed: changed.length };
}
function workspaceConflictPrompt(remote){
  return new Promise(resolve => {
    const merged = mergeDatabases(db, remote.db);
    const conflicts = merged.conflicts;
    let acceptLocalAll = false, acceptRemoteAll = false;
    modal(`
      ${modalHeader('Workspace conflict')}
      <div class="modalbody">
        <p style="font-size:14px;color:#475569;margin-bottom:12px">The file has a newer revision (rev ${remote.rev}) than your working copy (rev ${WS.rev||0}). Choose how to proceed:</p>
        <div class="flex wrap gap2" style="margin-bottom:12px">
          <button class="btn btn-dark" onclick="wsResolve('local')">${icon('check','sm')} Keep my version</button>
          <button class="btn btn-light" onclick="wsResolve('remote')">${icon('arrow-down','sm')} Load file version</button>
          <button class="btn btn-green" onclick="wsResolve('merge')">${icon('merge','sm')} Merge</button>
          <button class="btn btn-light" onclick="wsResolve('cancel')">Cancel</button>
        </div>
        ${conflicts.length? `<p style="font-size:12px;color:#b45309;margin-bottom:8px">${conflicts.length} conflicting record(s) found. Merge uses your version by default for each one.</p>` : ''}
        <div style="max-height:240px;overflow-y:auto">
          ${conflicts.slice(0,30).map((c,i)=>`
            <div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;font-size:13px">
              <div style="font-weight:600">${esc(c.entity)} · ${esc(c.id.slice(0,8))}…</div>
              <select class="select" id="confSel${i}" style="margin-top:6px">
                <option value="local" selected>Use my version</option>
                <option value="remote">Use file version</option>
              </select>
            </div>`).join('')}
        </div>
      </div>
    `);
    window.wsResolve = (choice) => {
      const sels = $$('select[id^="confSel"]');
      const picks = sels.map(s=>s.value);
      if(choice==='merge' && picks.length){
        const map = new Map();
        conflicts.forEach((c,i)=> map.set(c.id, picks[i]||'local'));
        const out = mergeDatabases(db, remote.db).db;
        ['clients','matters','timeEntries','expenses','invoices','auditLog','ledgerEntries','journalMeta'].forEach(key=>{
          out[key] = out[key].map(x=>{
            const idx = conflicts.findIndex(c=>c.id===x.id);
            if(idx>=0 && map.get(x.id)==='remote' && remote.db[key]){
              const r = remote.db[key].find(y=>y.id===x.id);
              if(r) return r;
            }
            return x;
          });
        });
        db = out; resolve('merge');
      } else {
        resolve(choice);
      }
      closeModal();
    };
  });
}

function clone(v){ if(v==null) return null; try{ return JSON.parse(JSON.stringify(v)); }catch(e){ return String(v); } }
function auditLogAdd(action, entity, before, after, label){
  const log = Array.isArray(db.auditLog)? db.auditLog : (db.auditLog=[]);
  const prev = log[log.length-1];
  const seq = prev? prev.seq+1 : 1;
  const base = { seq, ts:nowISO(), action, entity, entityId:(after&&after.id!=null)?after.id:(before&&before.id!=null)?before.id:null, label:label||'', before:clone(before), after:clone(after), prevHash: prev? prev.hash : 'genesis' };
  base.hash = cyrb53(JSON.stringify({seq:base.seq,ts:base.ts,action:base.action,entity:base.entity,entityId:base.entityId,label:base.label,before:base.before,after:base.after,prevHash:base.prevHash}),424242).toString(36);
  log.push(base);
  if(log.length>8000) log.splice(0, log.length-8000);
  return base;
}
function verifyAuditLog(){
  const log=Array.isArray(db.auditLog)?db.auditLog:[];
  if(!log.length) return {ok:true, count:0};
  for(let i=0;i<log.length;i++){
    const e=log[i];
    const ep = i===0? 'genesis' : log[i-1].hash;
    if(e.prevHash!==ep) return {ok:false, at:i, why:'prevHash mismatch'};
    const h=cyrb53(JSON.stringify({seq:e.seq,ts:e.ts,action:e.action,entity:e.entity,entityId:e.entityId,label:e.label,before:e.before,after:e.after,prevHash:e.prevHash}),424242).toString(36);
    if(h!==e.hash) return {ok:false, at:i, why:'entry hash mismatch'};
  }
  return {ok:true, count:log.length};
}

function computeDigest(){
  const payload = JSON.stringify({ c:db.clients, m:db.matters, t:db.timeEntries, e:db.expenses, i:db.invoices, s:db.settings, a:(db.auditLog||[]), l:(db.ledgerEntries||[]), j:(db.journalMeta||[]) });
  return { hash:cyrb53(payload, 777).toString(36), size:payload.length, rec: db.clients.length+db.matters.length+db.timeEntries.length+db.expenses.length+db.invoices.length+(db.auditLog?db.auditLog.length:0)+(db.ledgerEntries?db.ledgerEntries.length:0) };
}
function checkIntegrity(){
  const d = computeDigest();
  if(!meta.integrity) return {ok:true, digest:d, first:true};
  if(meta.integrity.hash!==d.hash || meta.integrity.size!==d.size) return {ok:false, expected:meta.integrity, actual:d};
  return {ok:true, digest:d};
}
function recordIntegrity(){ meta.integrity = computeDigest(); meta.lastIntegrityAt = nowISO(); saveMeta(); }
function validateSchema(){
  const errors=[];
  const matters=new Set(db.matters.map(m=>m.id));
  const clients=new Set(db.clients.map(c=>c.id));
  const okMoney=(v)=>(typeof v==='number'&&isFinite(v)&&v>=0);
  const okId=(id,set,label)=>{ if(!id) errors.push(`Missing ${label} id`); else if(!set.has(id)) errors.push(`Orphan reference: ${label} ${id}`); };
  db.clients.forEach((c,i)=>{ if(!c.id) errors.push(`Client #${i+1}: missing id`); if(!c.name) errors.push(`Client #${i+1}: missing name`); });
  db.matters.forEach((m,i)=>{ if(!m.id) errors.push(`Matter #${i+1}: missing id`); okId(m.clientId, clients, 'client'); if(!m.title) errors.push(`Matter #${i+1}: missing title`); if(m.hourlyRate!=null && !okMoney(m.hourlyRate)) errors.push(`Matter "${m.title}" has invalid hourly rate`); });
  db.timeEntries.forEach((t,i)=>{ if(!t.id) errors.push(`Time entry #${i+1}: missing id`); okId(t.matterId, matters, 'matter'); if(!t.date || isNaN(new Date(t.date))) errors.push(`Time entry #${i+1}: bad date`); if(!(t.minutes>=1 && t.minutes<=43200)) errors.push(`Time entry #${i+1}: minutes out of range`); if(!okMoney(t.rateAtEntry)) errors.push(`Time entry #${i+1}: rate invalid`); });
  db.expenses.forEach((x,i)=>{ if(!x.id) errors.push(`Expense #${i+1}: missing id`); okId(x.matterId, matters, 'matter'); if(!okMoney(x.amount)) errors.push(`Expense #${i+1}: invalid amount`); });
  db.invoices.forEach((inv,i)=>{
    if(!inv.id) errors.push(`Invoice #${i+1}: missing id`);
    okId(inv.matterId, matters, 'matter'); okId(inv.clientId, clients, 'client');
    if(!okMoney(inv.subtotal) || !okMoney(inv.total)) errors.push(`Invoice ${inv.number}: invalid totals`);
    const paid=(inv.payments || []).reduce((s,p)=>s+(+p.amount || 0),0);
    if(paid > inv.total + 0.01) errors.push(`Invoice ${inv.number}: payments exceed total`);
    if(inv.taxType==='cgst' && !okMoney(inv.cgst)) errors.push(`Invoice ${inv.number}: missing CGST`);
  });
  (db.ledgerEntries || []).forEach((e,i)=>{
    if(!e.id) errors.push(`Ledger entry #${i+1}: missing id`);
    if(!['office','client','bank'].includes(e.side)) errors.push(`Ledger entry #${i+1}: bad side`);
    if(!['d','c'].includes(e.dir)) errors.push(`Ledger entry #${i+1}: bad direction`);
    if(!okMoney(e.amount)) errors.push(`Ledger entry #${i+1}: invalid amount`);
    if(e.matterId && !matters.has(e.matterId)) errors.push(`Ledger entry #${i+1}: orphan matter`);
    if(e.clientId && !clients.has(e.clientId)) errors.push(`Ledger entry #${i+1}: orphan client`);
  });
  return errors;
}

let pinEntry=[], pinMode='enter', pinFirst=null, lockTicker=null;
function currentPinLength(){ return (db && db.settings && typeof db.settings.pinLength === 'number') ? db.settings.pinLength : 4; }
function renderLockScreen(){
  const ls=$('#lockScreen'); ls.classList.remove('hidden');
  const hasPin = db && db.settings.pinHash;
  pinMode = hasPin ? 'enter' : 'create';
  pinFirst=null; pinEntry=[];
  $('#lockSubtitle').textContent = hasPin ? 'Enter your PIN to continue' : 'Create a 4–6 digit PIN to protect your data';
  $('#lockMessage').textContent='';

  hideSplash();
}
function renderPinDots(){
  const n = pinMode==='enter' ? currentPinLength() : 6;
  $('#pinDots').innerHTML = Array.from({length:n},()=> '<span class="dot"></span>').join('');
  $$('#pinDots .dot').forEach((d,i)=> d.style.background = i<pinEntry.length ? '#0f172a' : 'transparent');
}
function renderKeypad(){
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#keypad').innerHTML = keys.map(k=>{
    if(k==='') return (pinMode==='create') ? `<button onclick="pinSubmit()" style="background:#0f172a;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center">${icon('check','sm')}</button>` : '<span></span>';
    if(k==='⌫') return `<button onclick="pinBackspace()">${icon('delete','sm')}</button>`;
    return `<button onclick="pinDigit('${k}')">${k}</button>`;
  }).join('');
}
function pinDigit(d){
  if(meta.lockout && meta.lockout.until > Date.now()) return;
  if(pinEntry.length >= 6) return;
  pinEntry.push(d); renderPinDots();
  if(pinMode==='enter'){
    const len = currentPinLength();
    if(pinEntry.length === len) setTimeout(pinSubmit, 80);
  } else {
    if(pinEntry.length === 6) setTimeout(pinSubmit, 80);
  }
}
function pinBackspace(){ pinEntry.pop(); renderPinDots(); }
function pinSubmit(){
  if(meta.lockout && meta.lockout.until > Date.now()) return;
  if(pinMode==='enter'){
    const ok = pinHash(pinEntry.join('')) === db.settings.pinHash;
    if(ok){ meta.lockout = {fails:0, until:0}; saveMeta(); unlockApp(); }
    else {
      const fl = meta.lockout.fails + 1;
      if(fl >= 5){ meta.lockout={fails:0, until:Date.now()+30000}; saveMeta(); startLockoutCountdown(); }
      else { meta.lockout={fails:fl, until:0}; saveMeta(); }
      $('#lockMessage').textContent = `Incorrect PIN (${fl}/5 attempts)`;
      pinEntry=[]; renderPinDots();
    }
  } else {
    if(pinFirst===null){
      if(pinEntry.length<4){ $('#lockMessage').textContent='PIN must be at least 4 digits'; pinEntry=[]; renderPinDots(); return; }
      pinFirst = pinEntry.join(''); pinEntry=[]; renderPinDots();
      $('#lockSubtitle').textContent='Confirm your PIN'; $('#lockMessage').textContent='';
    } else {
      if(pinEntry.length<4){ $('#lockMessage').textContent='PIN must be at least 4 digits'; pinEntry=[]; renderPinDots(); return; }
      if(pinEntry.join('') !== pinFirst){
        $('#lockMessage').textContent='PINs do not match — try again';
        pinFirst=null; pinEntry=[]; renderPinDots();
        $('#lockSubtitle').textContent='Create a 4–6 digit PIN to protect your data'; return;
      }
      db.settings.pinHash = pinHash(pinFirst);
      db.settings.pinLength = pinFirst.length;
      meta.integrity = computeDigest(); persistAll();
      toast('PIN set successfully'); unlockApp();
    }
  }
}

const matterById = id => db.matters.find(m=>m.id===id);
const mattersOfClient = cid => db.matters.filter(m=>m.clientId===cid);
const openMatters = () => db.matters.filter(m=>m.status!=='closed');
function matterUnbilledValue(matterId){
  let v=0;
  db.timeEntries.forEach(t=>{ if(t.matterId===matterId && t.billable && !t.invoiced) v += (t.minutes/60)*t.rateAtEntry; });
  db.expenses.forEach(x=>{ if(x.matterId===matterId && x.billable && !x.invoiced) v += x.amount; });
  return round2(v);
}
function matterOutstanding(matterId){
  let out=0;
  db.invoices.forEach(inv=>{
    if(inv.matterId===matterId && inv.status!=='void'){
      const paid=(inv.payments||[]).reduce((s,p)=>s+(+p.amount||0),0);
      out += inv.total - paid;
    }
  });
  return round2(out);
}
function invoicePaid(inv){ return round2((inv.payments||[]).reduce((s,p)=>s+(+p.amount||0),0)); }
function invoiceBalance(inv){ return round2(inv.total - invoicePaid(inv)); }
function invoiceStatusChip(inv){
  if(inv.status==='void') return `<span class="chip chip-gray">Voided</span>`;
  if(inv.status==='draft') return `<span class="chip chip-gray">Draft</span>`;
  const bal=invoiceBalance(inv);
  if(bal<=0.005) return `<span class="chip chip-green">Paid</span>`;
  if(invoicePaid(inv)>0) return `<span class="chip chip-amber">Partially paid</span>`;
  return `<span class="chip chip-blue">Issued</span>`;
}

function led(){ return db.ledgerEntries || (db.ledgerEntries=[]); }
function bal(side, account, f){
  f=f||{};
  let b=0;
  led().forEach(e=>{
    if(e.side!==side) return;
    if(account && e.account!==account) return;
    if(f.matterId && e.matterId!==f.matterId) return;
    if(f.clientId && e.clientId!==f.clientId) return;
    b += e.dir==='d' ? e.amount : -e.amount;
  });
  return round2(b);
}
function clientLedgerBalance(clientId){ return bal('client','Client Ledger',{clientId}); }
function clientBankBalance(clientId){ return bal('bank','Client Bank',{clientId}); }
function clientFundsAvailable(clientId){ return Math.max(0, round2(-clientLedgerBalance(clientId))); }
function matterClientId(mid){ const m=matterById(mid); return m?m.clientId:null; }
function clientFundsAvailableForMatter(mid){ const cid=matterClientId(mid); return cid? clientFundsAvailable(cid) : 0; }
function postJournal(o){
  const lines=o.lines||[];
  let d=0,c=0;
  lines.forEach(l=>{ if(l.dir==='d') d+=l.amount; else c+=l.amount; });
  if(Math.abs(d-c)>0.005){ toast('Journal unbalanced — debits must equal credits','error'); return false; }
  const jid=uid();
  lines.forEach(l=>{
    led().push({id:uid(), jid, date:o.date||todayISO(), clientId:o.clientId||null, matterId:o.matterId||null, side:l.side, account:l.account, amount:round2(l.amount), dir:l.dir, memo:o.desc||'', ref:o.ref||'', createdAt:nowISO()});
  });
  db.journalMeta=db.journalMeta||[];
  db.journalMeta.push({id:jid, date:o.date||todayISO(), clientId:o.clientId||null, matterId:o.matterId||null, desc:o.desc||'', ref:o.ref||'', createdAt:nowISO()});
  auditLogAdd('create','journal',null,{jid, desc:o.desc||'', lines}, 'Journal: '+(o.desc||''));
  recordIntegrity(); saveDB();
  return true;
}
function receiveClientMoney(clientId, matterId, amount, method, ref, date){
  amount=round2(+amount); if(amount<=0){ toast('Enter a positive amount','error'); return false; }
  const ok = postJournal({date, clientId, matterId, desc:'Client funds received', ref:method+(ref?' · '+ref:''), lines:[
    {side:'bank', account:'Client Bank', amount, dir:'d'},

  ]});

function transferToOffice(clientId, matterId, amount, desc, date){
  amount=round2(+amount); if(amount<=0){ toast('Enter a positive amount','error'); return false; }
  if(clientFundsAvailable(clientId) < amount - 0.005){ toast('Insufficient client funds for this client','error'); return false; }
  if(clientBankBalance(clientId) < amount - 0.005){ toast('Client bank balance is insufficient','error'); return false; }
  const ok = postJournal({date, clientId, matterId, desc:desc||'Transfer to office (earned fees)', lines:[
    {side:'client', account:'Client Ledger', amount, dir:'d'},
    {side:'office', account:'Fees Earned', amount, dir:'c'},
    {side:'bank', account:'Client Bank', amount, dir:'c'},
    {side:'bank', account:'Office Bank', amount, dir:'d'}
  ]});

}

function saveMatter(id){
  const fClient=$('#mfClient'), fTitle=$('#mfTitle');

  } else {

function deleteMatter(id){
  const busy = db.timeEntries.some(t=>t.matterId===id) || db.expenses.some(x=>x.matterId===id) || db.invoices.some(i=>i.matterId===id) || led().some(e=>e.matterId===id);
  if(busy){ toast('Matter has entries/invoices/ledger activity — close it instead of deleting','warn'); return; }
  if(!confirm('Delete this matter?')) return;
  const m=matterById(id);
  db.matters = db.matters.filter(x=>x.id!==id);
  auditLogAdd('delete','matter',m,null,'Matter: '+(m?m.title:''));
  recordIntegrity(); saveDB(); renderApp();

function timerRunning(){
  if(!meta.timer || !meta.timer.running) return null;
  let ms = (meta.timer.accumulatedMs||0) + (Date.now() - meta.timer.startedAt);
  return Object.assign({}, meta.timer, {ms});
}
function timerElapsedTotal(){
  const t=meta.timer; if(!t) return 0;
  return t.running ? t.accumulatedMs + (Date.now()-t.startedAt) : t.accumulatedMs;
}

          <div class="flex wrap gap3" style="padding-top:8px">
            ${!running? `<button onclick="timerStart()" class="btn btn-green" style="flex:1;justify-content:center;padding:12px">${icon('play','sm')} Start</button>${t && t.accumulatedMs>0 ? `<button onclick="timerStop(true)" class="btn btn-dark" style="flex:1;justify-content:center;padding:12px">${icon('save','sm')} Save &amp; reset</button>`:''}` : `<button onclick="timerPause()" class="btn" style="flex:1;justify-content:center;padding:12px;background:#d97706;color:#fff">${icon('pause','sm')} Pause</button><button onclick="timerStop(false)" class="btn btn-dark" style="flex:1;justify-content:center;padding:12px">${icon('stop-circle','sm')} Stop &amp; save</button>`}
          </div>
          <div class="flex center gap3" style="background:#f8fafc;border-radius:12px;padding:12px 16px;margin-top:16px"><span style="font-size:14px;color:#64748b;font-weight:500">${solLabel()}</span><select id="tmSol" class="select" style="flex:1" ${running?'disabled':''}>${['',...sols].map(s=>`<option value="${esc(s)}" ${defSol===s?'selected':''}>${s?esc(s):'— Unassigned —'}</option>`).join('')}</select></div>
          ${!running && t && t.accumulatedMs>0 && t.pausedAt ? `<div class="flex between" style="background:#f8fafc;border-radius:12px;padding:12px 16px;margin-top:12px;font-size:14px"><span style="color:#64748b">Paused at ${fmtDate(t.pausedAt)} · ${msToHMS(t.accumulatedMs)} elapsed</span><button class="btn btn-light" style="padding:4px 12px;color:#dc2626" onclick="timerDiscard()">Discard</button></div>`:''}
        </div>
      </div>

function timerStart(){
  const matterId=$('#tmMatter').value;
  if(!matterId){ toast('Select a matter first','warn'); return; }
  const sols=db.settings.solicitors||[];
  const sol = $('#tmSol') ? $('#tmSol').value : (sols.length===1?sols[0]:'');
  meta.timer = { running:true, matterId, note:$('#tmNote').value.trim(), solicitor:sol, startedAt:Date.now(), accumulatedMs:0, pausedAt:null };
  meta.integrity = computeDigest(); saveMeta();
  startTimerTicker(); renderApp(); toast('Timer started');
}
function timerPause(){
  const t=meta.timer; if(!t||!t.running) return;
  t.accumulatedMs += Date.now()-t.startedAt;
  t.running=false; t.pausedAt=nowISO();
  clearInterval(topTicker); meta.integrity=computeDigest(); saveMeta(); renderApp();
}
function timerStop(saveAndReset){
  const t=meta.timer; if(!t) return;
  const totalMs = timerElapsedTotal();
  if(totalMs < 60000){ toast('Timer ran less than a minute — entry not saved','warn'); meta.timer=null; saveMeta(); renderApp(); return; }
  const minutes = Math.max(1, Math.round(totalMs/60000));
  const matter=matterById(t.matterId);
  const rate = (matter && matter.rateType==='hourly') ? matter.hourlyRate : 0;
  const sols=db.settings.solicitors||[];
  const sol = t.solicitor || (sols.length===1?sols[0]:'');
  const entry={ id:uid(), matterId:t.matterId, solicitor:sol, date:todayISO(), startTime:null, endTime:null, minutes, description:t.note||'Timed work', billable: !!(matter && (matter.rateType==='hourly')), rateAtEntry: rate, invoiced:false, invoiceId:null, createdAt:nowISO() };
  db.timeEntries.push(entry);
  auditLogAdd('create','timeEntry',null,entry,'Timed work: '+minsToHM(minutes));
  meta.timer = null; recordIntegrity(); saveDB();
  if(saveAndReset){ toast(`Time entry saved (${minsToHM(minutes)})`); renderApp(); }
  else { toast(`Time entry saved (${minsToHM(minutes)})`); navTo('matter', t.matterId); }
}
function timerDiscard(){
  if(!confirm('Discard current timer session?')) return;
  meta.timer=null; saveMeta(); renderApp();
}

function saveExpense(id){
  const matterId=$('#exMatter').value;
  if(!matterId){ toast('Select a matter','error'); return; }
  const amount = round2(parseFloat($('#exAmount').value)||0);
  if(amount<=0){ toast('Enter a valid amount','error'); return; }
  const data = { matterId, date:$('#exDate').value, category:$('#exCat').value, amount, description:$('#exDesc').value.trim(), billable:$('#exBillable').value==='1' };
  if(id){
    const x=db.expenses.find(e=>e.id===id);
    if(!x){ toast('Expense not found','error'); return; }
    const before=clone(x); Object.assign(x,data); auditLogAdd('update','expense',before,x,'Expense updated'); toast('Expense updated');
  } else {
    const x=Object.assign({id:uid(), invoiced:false, invoiceId:null, createdAt:nowISO()}, data);
    db.expenses.push(x); auditLogAdd('create','expense',null,x,'Expense added'); toast('Expense added');
  }
  recordIntegrity(); saveDB(); closeModal(); renderApp();
}
function deleteExpense(id){
  const x=db.expenses.find(e=>e.id===id);
  if(x && x.invoiced){ toast('This expense is on an invoice — void the invoice first','warn'); return; }
  if(!confirm('Delete this expense?')) return;
  db.expenses = db.expenses.filter(e=>e.id!==id);
  auditLogAdd('delete','expense',x,null,'Expense deleted');
  recordIntegrity(); saveDB(); renderApp(); toast('Expense deleted','info');
}

function cmClientChanged(){
  const cid=$('#cmClient').value;
  const sel=$('#cmMatter');
  [...sel.options].forEach(o=>{ o.disabled = o.dataset.client && o.dataset.client!==cid; });
  if(sel.value){ const o=sel.options[sel.selectedIndex]; if(o && o.disabled) sel.value=''; }

function cmSubmit(){
  const t=$('#cmType').value;
  const clientId=$('#cmClient').value;
  const matterId=$('#cmMatter').value || null;
  const amount=round2(parseFloat($('#cmAmount').value)||0);
  const date=$('#cmDate').value||todayISO();
  const ref=$('#cmRef').value.trim();
  const memo=$('#cmMemo').value.trim();
  if(!clientId){ toast('Select a client','error'); return; }
  if(amount<=0){ toast('Enter a positive amount','error'); return; }
  if(matterId){ const m=matterById(matterId); if(m && m.clientId!==clientId){ toast('Matter does not belong to this client','error'); return; } }
  if(t==='receive') receiveClientMoney(clientId, matterId, amount, ref||'Bank transfer', memo, date);
  else if(t==='transfer') transferToOffice(clientId, matterId, amount, memo||'Transfer to office', date);
  else disburseFromClient(clientId, matterId, amount, ref, memo, date);
  renderApp();
}

  const matterId = builderState.matterId;
  const timeCands = db.timeEntries.filter(t=> !t.invoiced && t.billable && (!matterId || t.matterId===matterId)).sort((a,b)=>a.date.localeCompare(b.date));

  const opts = `<option value="">— select matter —</option>` + db.matters.map(m=>{

  const M = computeBuilderTotals();

  const modeOpts = J.modes.map(mo=>`<option value="${mo.id}" ${builderState.taxType===mo.id?'selected':''}>${mo.label}</option>`).join('');
  return `

      <div class="card"><div class="cardhead"><span>2 · Billable items <span style="color:#94a3b8;font-weight:400">(unbilled)</span></span><button class="btn btn-light" style="padding:4px 12px" onclick="builderAddAll()">Add all</button></div><div class="cardbody">
        ${matterId? `<div style="font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:8px">Time — ${timeCands.filter(t=>t.matterId===matterId).length} available</div><div style="margin-bottom:20px">${timeCands.filter(t=>t.matterId===matterId).map(t=>{
          const val=round2((t.minutes/60)*t.rateAtEntry);
          const inState = builderState.items.some(it=>it.refId===t.id);
          return `<label class="flex center gap3" style="border:1px solid ${inState?'#0f172a':'#e2e8f0'};background:${inState?'#f8fafc':'#fff'};border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer"><input type="checkbox" style="accent-color:#0f172a" ${inState?'checked':''} onchange="builderToggle('time','${t.id}')"><span class="grow"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px">${esc(t.description||'Time entry')}</span><span style="display:block;font-size:11px;color:#94a3b8">${fmtDate(t.date)} · ${minsToHM(t.minutes)} · ${esc(t.solicitor||'unassigned')}</span></span><span style="font-weight:600;font-size:14px">${fmtINR(val)}</span></label>`;}).join('') || `<p style="font-size:14px;color:#94a3b8">No billable time available.</p>`}</div><div style="font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;margin-bottom:8px">Expenses — ${expCands.filter(x=>x.matterId===matterId).length} available</div><div>${expCands.filter(x=>x.matterId===matterId).map(x=>{
          const inState = builderState.items.some(it=>it.refId===x.id);
          return `<label class="flex center gap3" style="border:1px solid ${inState?'#0f172a':'#e2e8f0'};background:${inState?'#f8fafc':'#fff'};border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer"><input type="checkbox" style="accent-color:#0f172a" ${inState?'checked':''} onchange="builderToggle('expense','${x.id}')"><span class="grow"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px">${esc(x.description||x.category||'Expense')}</span><span style="display:block;font-size:11px;color:#94a3b8">${fmtDate(x.date)} · ${esc(x.category||'Other')}</span></span><span style="font-weight:600;font-size:14px">${fmtINR(x.amount)}</span></label>`;}).join('') || `<p style="font-size:14px;color:#94a3b8">No billable expenses available.</p>`}</div>` : `<div style="padding:24px;text-align:center;color:#94a3b8;font-size:14px">Select a matter first to see its unbilled time and expenses.</div>`}
      </div></div>
      <div class="card"><div class="cardhead">3 · Invoice lines</div><div class="cardbody">${itemsHtml}<div class="flex gap2" style="padding-top:8px"><input id="manualDesc" class="input" style="flex:1" placeholder="Manual line description"><input id="manualAmt" type="number" min="0" step="0.01" class="input" style="width:100px" placeholder="₹"><button class="btn btn-light" onclick="builderAddManual()">${icon('plus','sm')}</button></div></div></div>
      <div class="card"><div class="cardhead">4 · Tax &amp; totals</div><div class="cardbody">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="invTaxToggle" style="accent-color:#0f172a;width:16px;height:16px" ${taxEnabled?'checked':''} onchange="toggleBuilderTax()"><label for="invTaxToggle" style="font-size:14px;font-weight:600">Apply ${esc(J.taxLabel)} to this invoice</label></div>
        ${taxEnabled? (J.modes.length>1? `<div class="grid g2">${field(J.taxLabel+' rate', `<select id="invTaxRate" class="select" onchange="builderState.taxRate=+this.value;renderApp()">${rateOpts}</select>`)}${field('Type', `<select id="invTaxType" class="select" onchange="builderState.taxType=this.value;renderApp()">${modeOpts}</select>`)}</div>` : (J.modes[0]&&J.modes[0].id!=='none'? `<div class="grid g2">${field(J.taxLabel+' rate', `<select id="invTaxRate" class="select" onchange="builderState.taxRate=+this.value;renderApp()">${rateOpts}</select>`)}</div>` : `<p style="font-size:12px;color:#94a3b8">No tax is applied in this jurisdiction by default.</p>`)) : `<p style="font-size:12px;color:#94a3b8">Tax is disabled in Settings — this invoice will be issued without tax.</p>`}

          ${taxEnabled && M.igst>0? `<div class="flex between" style="margin-bottom:6px"><span style="color:#64748b">IGST (${builderState.taxRate}%)</span><span style="font-weight:600">${fmtINR(M.igst)}</span></div>` : ''}

          ${taxEnabled && M.sgst>0? `<div class="flex between" style="margin-bottom:6px"><span style="color:#64748b">SGST (${builderState.taxRate/2}%)</span><span style="font-weight:600">${fmtINR(M.sgst)}</span></div>` : ''}
          ${taxEnabled && M.vat>0? `<div class="flex between" style="margin-bottom:6px"><span style="color:#64748b">VAT (${builderState.taxRate}%)</span><span style="font-weight:600">${fmtINR(M.vat)}</span></div>` : ''}

          <div class="flex between" style="border-top:1px solid #e2e8f0;padding-top:8px;font-size:16px;font-weight:800"><span>Total</span><span>${fmtINR(M.total)}</span></div>
        </div>

      </div></div>
    </div>`;
}
function toggleBuilderTax(){
  const on = $('#invTaxToggle').checked;
  const J=juris();
  builderState.taxRate = on ? J.defRate : 0;
  builderState.taxType = on ? J.defMode : 'none';
  renderApp();
}
function computeBuilderTotals(){
  const subtotal = round2(builderState.items.reduce((s,it)=>s+it.amount,0));
  const on = taxOn();
  const taxAmt = on ? round2(subtotal * builderState.taxRate / 100) : 0;
  let cgst=0,sgst=0,igst=0,vat=0,flatTax=0;
  if(on){
    if(builderState.taxType==='igst') igst=taxAmt;
    else if(builderState.taxType==='cgst'){ cgst=round2(taxAmt/2); sgst=round2(taxAmt-cgst); }
    else if(builderState.taxType==='vat') vat=taxAmt;
    else if(builderState.taxType==='flat') flatTax=taxAmt;
  }
  return { subtotal, cgst, sgst, igst, vat, flatTax, total: round2(subtotal+taxAmt) };
}
function builderToggle(kind, refId){
  const idx = builderState.items.findIndex(it=>it.refId===refId);
  if(idx>=0){ builderState.items.splice(idx,1); }
  else {
    if(kind==='time'){
      const t=db.timeEntries.find(x=>x.id===refId);
      builderState.items.push({id:uid(), kind:'time', refId, desc:(t.description||'Time entry') + ` (${fmtDate(t.date)}, ${minsToHM(t.minutes)})`, amount: round2((t.minutes/60)*t.rateAtEntry)});
    } else {
      const x=db.expenses.find(e=>e.id===refId);
      builderState.items.push({id:uid(), kind:'expense', refId, desc:(x.description||x.category||'Expense') + ` (${fmtDate(x.date)})`, amount: x.amount});
    }
  }
  renderApp();
}
function builderAddAll(){
  const mid=builderState.matterId; if(!mid) return;
  db.timeEntries.filter(t=>t.matterId===mid && !t.invoiced && t.billable).forEach(t=>{
    if(!builderState.items.some(it=>it.refId===t.id)) builderState.items.push({id:uid(), kind:'time', refId:t.id, desc:(t.description||'Time entry')+` (${fmtDate(t.date)}, ${minsToHM(t.minutes)})`, amount:round2((t.minutes/60)*t.rateAtEntry)});
  });
  db.expenses.filter(x=>x.matterId===mid && !x.invoiced && x.billable).forEach(x=>{
    if(!builderState.items.some(it=>it.refId===x.id)) builderState.items.push({id:uid(), kind:'expense', refId:x.id, desc:(x.description||x.category||'Expense')+` (${fmtDate(x.date)})`, amount:x.amount});
  });
  renderApp();
}
function builderAddManual(){
  const d=$('#manualDesc').value.trim(), a=round2(parseFloat($('#manualAmt').value)||0);
  if(!d || a<=0){ toast('Enter a description and amount','warn'); return; }
  builderState.items.push({id:uid(), kind:'manual', refId:null, desc:d, amount:a});
  $('#manualDesc').value=''; $('#manualAmt').value='';
  renderApp();
}
function builderRemoveItem(idx){ builderState.items.splice(idx,1); renderApp(); }
function saveInvoice(issue){
  if(!builderState.matterId){ toast('Select a matter','error'); return; }
  if(!builderState.items.length){ toast('Add at least one line item','error'); return; }
  const J=juris();
  const m=matterById(builderState.matterId); if(!m) return;
  const M = computeBuilderTotals();
  const on = taxOn();
  const num = issue ? `INV-${new Date().getFullYear()}-${String(db.seq.invoice).padStart(4,'0')}` : `DRF-${new Date().getFullYear()}-${String(db.seq.invoice).padStart(4,'0')}`;
  const inv = { id:uid(), number:num, matterId:m.id, clientId:m.clientId, date:todayISO(), dueDate:addDaysISO(todayISO(), 15), items: builderState.items.map(it=>({id:it.id, kind:it.kind, refId:it.refId, desc:it.desc, amount:it.amount})), taxRate: on?builderState.taxRate:0, taxType: on?builderState.taxType:'none', taxEnabled:on, subtotal:M.subtotal, cgst:M.cgst, sgst:M.sgst, igst:M.igst, vat:M.vat, flatTax:M.flatTax, total:M.total, status: issue ? 'issued' : 'draft', payments:[], createdAt:nowISO(), stale:false };
  db.invoices.push(inv);
  if(issue){
    builderState.items.forEach(it=>{
      if(it.refId && it.kind==='time'){ const t=db.timeEntries.find(x=>x.id===it.refId); if(t){t.invoiced=true; t.invoiceId=inv.id;} }
      if(it.refId && it.kind==='expense'){ const x=db.expenses.find(e=>e.id===it.refId); if(x){x.invoiced=true; x.invoiceId=inv.id;} }
    });
    db.seq.invoice++; toast('Invoice issued: '+num);
  } else { toast('Draft saved: '+num); }
  auditLogAdd('create','invoice',null,inv,'Invoice: '+num);
  builderState={ matterId:'', items:[], taxRate:J.defRate, taxType:J.defMode };
  recordIntegrity(); saveDB(); navTo('invoice', inv.id);
}
function voidInvoice(id){
  const inv=db.invoices.find(i=>i.id===id); if(!inv) return;
  if(!confirm(`Void invoice ${inv.number}? This will un-mark its items as billable.`)) return;
  const before=clone(inv);
  inv.status='void';
  (inv.items||[]).forEach(it=>{
    if(it.refId && it.kind==='time'){ const t=db.timeEntries.find(x=>x.id===it.refId); if(t){t.invoiced=false; t.invoiceId=null;} }
    if(it.refId && it.kind==='expense'){ const x=db.expenses.find(e=>e.id===it.refId); if(x){x.invoiced=false; x.invoiceId=null;} }
  });
  auditLogAdd('update','invoice',before,inv,'Voided: '+inv.number);
  recordIntegrity(); saveDB(); renderApp(); toast('Invoice voided','info');
}
function regenerateInvoice(id){
  const inv=db.invoices.find(i=>i.id===id); if(!inv) return;
  const before=clone(inv);
  let changed=false;
  (inv.items||[]).forEach(it=>{
    if(it.refId && it.kind==='time'){
      const t=db.timeEntries.find(x=>x.id===it.refId);
      if(t){ const v=round2((t.minutes/60)*t.rateAtEntry); if(v!==it.amount){it.amount=v; changed=true;} it.desc=(t.description||'Time entry')+` (${fmtDate(t.date)}, ${minsToHM(t.minutes)})`; }
    }
    if(it.refId && it.kind==='expense'){
      const x=db.expenses.find(e=>e.id===it.refId);
      if(x){ if(x.amount!==it.amount){it.amount=x.amount; changed=true;} it.desc=(x.description||x.category||'Expense')+` (${fmtDate(x.date)})`; }
    }
  });
  const mo = computeInvoiceTotals(inv);
  inv.subtotal=mo.subtotal; inv.cgst=mo.cgst; inv.sgst=mo.sgst; inv.igst=mo.igst; inv.vat=mo.vat; inv.flatTax=mo.flatTax; inv.total=mo.total; inv.stale=false;
  auditLogAdd('update','invoice',before,inv,'Regenerated: '+inv.number);
  recordIntegrity(); saveDB(); renderApp(); toast(changed?'Invoice regenerated with updated amounts':'Items unchanged — totals refreshed');
}
function computeInvoiceTotals(inv){
  const subtotal=round2((inv.items||[]).reduce((s,it)=>s+it.amount,0));
  const on = inv.taxEnabled === true;
  const taxAmt = on ? round2(subtotal*inv.taxRate/100) : 0;
  let cgst=0,sgst=0,igst=0,vat=0,flatTax=0;
  if(on){
    if(inv.taxType==='igst') igst=taxAmt;
    else if(inv.taxType==='cgst'){ cgst=round2(taxAmt/2); sgst=round2(taxAmt-cgst); }
    else if(inv.taxType==='vat') vat=taxAmt;
    else if(inv.taxType==='flat') flatTax=taxAmt;
  }
  return {subtotal, cgst, sgst, igst, vat, flatTax, total:round2(subtotal+taxAmt)};
}

      <div class="flex between" style="padding-bottom:24px;border-bottom:1px solid #e2e8f0"><div><h2>${esc(db.settings.firmName)}</h2><div class="muted" style="white-space:pre-line">${esc(db.settings.firmAddress)}</div><div class="small" style="margin-top:4px">${db.settings.firmGstin?`<div>${esc(J.taxNoLabel)}: ${esc(db.settings.firmGstin)}</div>`:''}${db.settings.firmEmail?`<div>${esc(db.settings.firmEmail)}</div>`:''}${db.settings.firmPhone?`<div>${esc(db.settings.firmPhone)}</div>`:''}</div></div><div style="text-align:right"><div style="display:inline-block;background:#0f172a;color:#fff;padding:8px 16px;border-radius:12px;font-weight:700;font-size:14px">${esc(inv.number)}</div><div class="small" style="margin-top:8px">${inv.status==='draft'?'DRAFT — not an official document':'Tax invoice'}</div></div></div>
      <div class="grid g2" style="padding:24px 0"><div><div class="small" style="text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Billed to</div><div style="font-weight:700">${esc(c?c.name:'')}</div>${c&&c.gstin?`<div class="muted">${esc(J.taxNoLabel)}: ${esc(c.gstin)}</div>`:''}${c&&c.address?`<div class="muted" style="white-space:pre-line">${esc(c.address)}</div>`:''}<div class="muted" style="margin-top:4px">${esc(m?m.title:'')}</div></div><div style="text-align:right;font-size:14px"><div class="flex between" style="justify-content:flex-end;gap:24px"><span class="small">Invoice date</span><span style="font-weight:500">${fmtDate(inv.date)}</span></div><div class="flex between" style="justify-content:flex-end;gap:24px;margin-top:4px"><span class="small">Due date</span><span style="font-weight:500">${fmtDate(inv.dueDate)}</span></div><div class="flex between" style="justify-content:flex-end;gap:24px;margin-top:4px"><span class="small">Status</span><span style="font-weight:500">${inv.status==='void'?'Voided':bal<=0.005&&paid>0?'Paid':inv.status==='draft'?'Draft':'Issued'}</span></div></div></div>

function savePayment(invoiceId){
  const inv=db.invoices.find(i=>i.id===invoiceId); if(!inv) return;
  const amt=round2(parseFloat($('#pmAmt').value)||0);
  if(amt<=0){ toast('Enter a valid amount','error'); return; }
  const bal=invoiceBalance(inv);
  if(amt>bal+0.005){ toast(`Amount exceeds balance (${fmtINR(bal)})`,'error'); return; }
  const method=$('#pmMethod').value;
  if(method==='CM'){
    if(!transferToOffice(inv.clientId, inv.matterId, amt, 'Payment '+inv.number, $('#pmDate').value||todayISO())) return;
  }
  const receiptNo = `RCT-${new Date().getFullYear()}-${String(db.seq.receipt).padStart(4,'0')}`;
  const before=clone(inv);
  inv.payments = inv.payments||[];
  inv.payments.push({id:uid(), date:$('#pmDate').value, amount:amt, method: method==='CM'?'Client money':method, reference:$('#pmRef').value.trim(), note:$('#pmNote').value.trim(), receiptNo, createdAt:nowISO()});
  db.seq.receipt++;
  if(invoiceBalance(inv)<=0.005) inv.status='issued';
  auditLogAdd('update','invoice',before,inv,'Payment '+receiptNo);
  recordIntegrity(); saveDB(); closeModal(); renderApp(); toast('Payment recorded — receipt '+receiptNo);
}
function markFullyPaid(invoiceId){
  const inv=db.invoices.find(i=>i.id===invoiceId); if(!inv) return;
  const bal=invoiceBalance(inv);
  if(bal<=0.005) return;
  if(!confirm(`Mark ${inv.number} as fully paid (${fmtINR(bal)})?`)) return;
  const receiptNo=`RCT-${new Date().getFullYear()}-${String(db.seq.receipt).padStart(4,'0')}`;
  const before=clone(inv);
  inv.payments=inv.payments||[]; inv.payments.push({id:uid(), date:todayISO(), amount:bal, method:'Bank transfer', reference:'Adjusted', note:'Marked fully paid', receiptNo, createdAt:nowISO()});
  db.seq.receipt++;
  auditLogAdd('update','invoice',before,inv,'Marked paid: '+inv.number);
  recordIntegrity(); saveDB(); renderApp(); toast('Invoice marked paid');
}

function exportReportsCSV(){
  const lines=[];
  lines.push(solLabel().toUpperCase()+' PRODUCTIVITY'); lines.push(`${solLabel()},Entries,Minutes,Hours,Billable minutes,Billed value,Unbilled value,This month minutes`);
  const solMap=new Map();
  db.timeEntries.forEach(t=>{ const k=t.solicitor||'('+solLabel()+')'; if(!solMap.has(k))solMap.set(k,{entries:0,min:0,bmin:0,bv:0,uv:0,mo:0}); const s=solMap.get(k); s.entries++; s.min+=t.minutes; if(t.billable){s.bmin+=t.minutes; const v=(t.minutes/60)*t.rateAtEntry; if(t.invoiced)s.bv+=v;else s.uv+=v;} if(t.date.slice(0,7)===todayISO().slice(0,7))s.mo+=t.minutes; });
  solMap.forEach((s,k)=>lines.push([k,s.entries,s.min,(s.min/60).toFixed(2),s.bmin,s.bv.toFixed(2),s.uv.toFixed(2),s.mo].join(',')));
  lines.push(''); lines.push('OUTSTANDING BY CLIENT'); lines.push('Client,Invoiced,Collected,Outstanding');
  const cm=new Map();
  db.invoices.filter(i=>i.status!=='void').forEach(inv=>{ const k=inv.clientId; if(!cm.has(k))cm.set(k,{iv:0,col:0,out:0}); const r=cm.get(k); r.iv+=inv.total; r.col+=invoicePaid(inv); r.out+=invoiceBalance(inv); });
  cm.forEach((r,k)=>lines.push([clientById(k)?clientById(k).name:'?', r.iv.toFixed(2), r.col.toFixed(2), r.out.toFixed(2)].join(',')));
  if(clientMoneyOn()){
    lines.push(''); lines.push('CLIENT MONEY'); lines.push('Client,Available funds,Client bank balance');
    db.clients.forEach(c=>{ const b=clientFundsAvailable(c.id); if(b>0) lines.push([c.name, b.toFixed(2), clientBankBalance(c.id).toFixed(2)].join(',')); });
  }
  downloadFile('lex-reports-'+todayISO()+'.csv', String.fromCharCode(0xFEFF)+lines.join(String.fromCharCode(10)));
}

const b64FromBuf = buf => { let s=''; new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); };
const bufFromB64 = s => { const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u.buffer; };
const cryptoAvailable = () => typeof crypto!=='undefined' && crypto.subtle && crypto.subtle.encrypt;
async function deriveKeyPBKDF2(password, salt){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:120000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptBackup(jsonStr, password){
  if(cryptoAvailable()){
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await deriveKeyPBKDF2(password, salt);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(jsonStr));
    return {v:1, alg:'AES-GCM/PBKDF2', salt:b64FromBuf(salt), iv:b64FromBuf(iv), data:b64FromBuf(ct), createdAt:nowISO()};
  }
  function stretch(pwd, saltArr, len){ let state=0x9E3779B9, out=new Uint8Array(len), pos=0; const mix=()=>{ for(let i=0;i<pwd.length;i++){ state=Math.imul(state ^ pwd.charCodeAt(i), 2654435761); state^=state>>>13; } for(let i=0;i<saltArr.length;i++){ state=Math.imul(state ^ saltArr[i], 1597334677); state^=state>>>7; } return state>>>0; }; while(pos<len){ const v=mix(); out[pos++]=v&0xff; out[pos++]=v>>>8&0xff; } return out; }
  function rc4(key, data){ const S=Array.from({length:256},(_,i)=>i); let j=0; for(let i=0;i<256;i++){ j=(j+S[i]+key[i%key.length])&255; [S[i],S[j]]=[S[j],S[i]]; } let i=0; j=0; const out=new Uint8Array(data.length); for(let n=0;n<data.length;n++){ i=(i+1)&255; j=(j+S[i])&255; [S[i],S[j]]=[S[j],S[i]]; out[n]=data[n]^S[(S[i]+S[j])&255]; } return out; }
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=stretch(password, salt, 64);
  const data=new TextEncoder().encode(jsonStr);
  const ct=rc4(key, data);
  return {v:1, alg:'RC4-PBKDF2-v1', salt:b64FromBuf(salt), data:b64FromBuf(ct), createdAt:nowISO()};
}
async function decryptBackup(obj, password){
  if(!obj || !obj.alg) throw new Error('Not a LexTime backup file');
  if(obj.alg==='AES-GCM/PBKDF2'){
    if(!cryptoAvailable()) throw new Error('Strong crypto unavailable in this browser context — open via localhost/HTTPS to restore AES backups');
    const salt=new Uint8Array(bufFromB64(obj.salt));
    const iv=new Uint8Array(bufFromB64(obj.iv));
    const key=await deriveKeyPBKDF2(password, salt);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, bufFromB64(obj.data));
    return new TextDecoder().decode(pt);
  }
  if(obj.alg==='RC4-PBKDF2-v1'){
    function stretch(pwd, saltArr, len){ let state=0x9E3779B9, out=new Uint8Array(len), pos=0; const mix=()=>{ for(let i=0;i<pwd.length;i++){ state=Math.imul(state ^ pwd.charCodeAt(i), 2654435761); state^=state>>>13; } for(let i=0;i<saltArr.length;i++){ state=Math.imul(state ^ saltArr[i], 1597334677); state^=state>>>7; } return state>>>0; }; while(pos<len){ const v=mix(); out[pos++]=v&0xff; out[pos++]=v>>>8&0xff; } return out; }
    function rc4(key, data){ const S=Array.from({length:256},(_,i)=>i); let j=0; for(let i=0;i<256;i++){ j=(j+S[i]+key[i%key.length])&255; [S[i],S[j]]=[S[j],S[i]]; } let i=0; j=0; const out=new Uint8Array(data.length); for(let n=0;n<data.length;n++){ i=(i+1)&255; j=(j+S[i])&255; [S[i],S[j]]=[S[j],S[i]]; out[n]=data[n]^S[(S[i]+S[j])&255]; } return out; }
    const salt=new Uint8Array(bufFromB64(obj.salt));
    const key=stretch(password, salt, 64);
    const ct=new Uint8Array(bufFromB64(obj.data));
    return new TextDecoder().decode(rc4(key, ct));
  }
  throw new Error('Unknown backup format: '+obj.alg);
}
async function exportBackup(){

async function doRestore(){
  const file = window._restoreFile; if(!file) return;
  const p=$('#rsPass').value;
  const oldSum = db? {clients:db.clients.length,matters:db.matters.length,entries:db.timeEntries.length,invoices:db.invoices.length} : null;
  try{
    const text = await file.text();
    const box = JSON.parse(text);
    const jsonStr = await decryptBackup(box, p);
    const parsed = JSON.parse(jsonStr);
    const raw = parsed.data || parsed;
    if(!raw || !raw.settings || !Array.isArray(raw.clients)) throw new Error('Invalid LexTime backup structure');
    const oldDb = db;
    const data = normalizeParsed(raw);
    db = data;
    const errs = validateSchema();
    if(errs.length){ db=oldDb; throw new Error('Backup failed validation: '+errs.slice(0,3).join('; ')); }
    const newSum={clients:db.clients.length,matters:db.matters.length,entries:db.timeEntries.length,invoices:db.invoices.length};
    auditLogAdd('create','data',oldSum,newSum,'Restored from backup');
    meta.integrity = computeDigest(); meta.lastBackupAt = nowISO(); persistAll();
    closeModal(); toast('Backup restored successfully'); navTo('dashboard');
  }catch(e){ toast('Restore failed: '+((e&&e.message)||'wrong password?'),'error'); }
}
function runAutomaticIntegrity(){
  const today=todayISO();
  const res = checkIntegrity();
  if(res.ok && meta.lastIntegrityDay===today) return;
  if(!res.ok){ toast('⚠ Integrity check failed — data may be corrupted. Open Backup & Integrity for details.','error'); }
  runManualIntegrity(true);
}
function runManualIntegrity(silent){
  const res = checkIntegrity();
  if(!res.ok){ meta.lastIntegrityDay = todayISO(); meta.lastIntegrityAt = nowISO(); saveMeta(); toast('Integrity check FAILED — data does not match its checksum.','error'); }
  else { meta.integrity = res.digest; meta.lastIntegrityDay = todayISO(); meta.lastIntegrityAt = nowISO(); saveMeta(); if(!silent) toast('Integrity check passed — all records valid'); }
  renderApp();
}
function downloadFile(filename, text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text], {type:'application/json'}));
  a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

function inrWords(num){
  num = Math.round((+num||0)*100)/100;
  const J=juris();
  const unit = J.code==='US' ? 'Dollar' : J.code==='GB' ? 'Pound' : J.code==='OTHER' ? 'Unit' : 'Rupee';
  const unitPlural = unit==='Rupee'?'Rupees':unit==='Dollar'?'Dollars':unit==='Pound'?'Pounds':'Units';
  const small = J.code==='US' ? 'Cent' : J.code==='GB' ? 'Penny' : J.code==='OTHER' ? 'Sub-unit' : 'Paise';
  const smallPlural = small==='Paise'?'Paise':small==='Cent'?'Cents':small==='Penny'?'Pence':small+'s';
  if(num===0) return 'Zero '+unitPlural;
  const rupees = Math.floor(num);
  const paise = Math.round((num-rupees)*100);
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){ return n<20? ones[n] : (tens[Math.floor(n/10)] + (n%10? ' '+ones[n%10]:'')); }
  function three(n){ const h=Math.floor(n/100), r=n%100; return (h? ones[h]+' Hundred'+(r?' ':'') : '') + (r? two(r):''); }
  function words(n){
    if(n===0) return '';
    const crore=Math.floor(n/10000000), lakh=Math.floor((n%10000000)/100000), thousand=Math.floor((n%100000)/1000), rest=n%1000;
    let out='';
    if(crore) out+=words(crore)+' Crore ';
    if(lakh) out+=two(lakh)+' Lakh ';
    if(thousand) out+=two(thousand)+' Thousand ';
    if(rest) out+=three(rest)+' ';
    return out.trim();
  }
  let out = words(rupees) + (rupees===1?' '+unit:' '+unitPlural);
  if(paise) out += ' and ' + two(paise) + (paise===1?' '+small:' '+smallPlural);
  return out;
}

window.addEventListener('error', ev=>{
  console.error(ev.error || ev.message);
  const msg = ev.message || String(ev.error || ev);
  const s = $('#splashStatus');
  if(s){ s.textContent = 'Startup error: ' + msg; s.style.color = '#f87171'; }
});
window.addEventListener('unhandledrejection', ev=>{
  const s = $('#splashStatus');
  if(s){ s.textContent = 'Startup error: ' + String(ev.reason); s.style.color = '#f87171'; }
});
function init(){
  splashStatus('Loading your data…');

  const hasDb = loadDB();
  if(!hasDb){ db = defaultDB(); saveDB(); }
  splashStatus(hasDb ? 'Opening LexTime…' : 'First run — create your PIN');

}
function boot(){ try { init(); } catch(e){ console.error(e); splashStatus('Startup error: ' + (e && e.message ? e.message : e)); } }
if(document.readyState === 'loading'){ window.addEventListener('DOMContentLoaded', boot); } else { boot(); }
